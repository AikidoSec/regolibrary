apiVersion: apps/v1
kind: Deployment
metadata:
  name: centraldashboard
  namespace: kubeflow
  labels:
    app: centraldashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: centraldashboard
  template:
    metadata:
      labels:
        app: centraldashboard
    spec:
      containers:
        - name: centraldashboard
          image: ghcr.io/kubeflow/kubeflow/central-dashboard:v1.10.0
          ports:
            - containerPort: 8082
